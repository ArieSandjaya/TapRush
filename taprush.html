<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tap Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100dvh;background:#0f0f1a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const S=7
const c=document.getElementById('c')
const x=c.getContext('2d')
let W,H,sw,ph,py,br,running=false,alive=false,score=0,hi=parseInt(localStorage.getItem('tr_hi'))||0,gap=3
let balls=[],speed=0.45,intv=1500,lastSpawn=0,lastT=0,streak=0,play=0

function resize(){
 W=c.width=window.innerWidth
 H=c.height=window.innerHeight
 sw=W/S
 ph=H*0.12
 py=H-ph
 br=sw*0.35
}
window.onresize=resize
resize()

function tap(e){
 e.preventDefault()
 const t=e.changedTouches?e.changedTouches[0]:e
 const r=c.getBoundingClientRect()
 const x=(t.clientX-r.left)/r.width*W
 if(!running||!alive){start();return}
 if(x<W/2){if(gap>0)gap--}else{if(gap<S-1)gap++}
}
c.addEventListener('click',tap)
c.addEventListener('touchstart',tap,{passive:false})

function start(){
 gap=Math.floor(S/2)
 score=0;alive=true;running=true
 balls=[];speed=0.45;intv=1500;streak=0;lastSpawn=0;lastT=0
 play++
}

function tick(t){
 if(!running||!alive)return
 if(!lastT){lastT=t;lastSpawn=t;return}
 const dt=Math.min((t-lastT)/1000,0.05)
 lastT=t
 if(t-lastSpawn>=intv){
  balls.push({c:Math.floor(Math.random()*S),p:0})
  lastSpawn=t
 }
 for(let i=balls.length-1;i>=0;i--){
  const b=balls[i]
  b.p+=speed*dt
  if(b.p>=1){
   balls.splice(i,1)
   if(b.c===gap){alive=false;if(score>hi){hi=score;localStorage.setItem('tr_hi',hi)};return}
   score++;streak++
   if(streak%5===0){speed=Math.min(speed+0.04,2);intv=Math.max(intv-50,300)}
  }
 }
}

function draw(){
 x.clearRect(0,0,W,H)
 // bg
 x.fillStyle='#0f0f1a'
 x.fillRect(0,0,W,H)
 // platform
 for(let i=0;i<S;i++){
  const l=i*sw+1,w=sw-2,h=ph-2
  if(i===gap){
   x.fillStyle='#1a1a2e'
   x.fillRect(l,py+1,w,h)
   x.strokeStyle='#e74c3c'
   x.lineWidth=3
   x.strokeRect(l,py+1,w,h)
  }else{
   x.fillStyle='#6c63ff'
   x.fillRect(l,py+1,w,h)
  }
 }
 // balls
 for(const b of balls){
  const cx=b.c*sw+sw/2,cy=py*b.p
  x.fillStyle='rgba(243,156,18,0.2)'
  x.beginPath()
  x.arc(cx,cy,br*2.2,0,7)
  x.fill()
  x.fillStyle='#f1c40f'
  x.beginPath()
  x.arc(cx,cy,br,0,7)
  x.fill()
  x.fillStyle='rgba(255,255,255,0.5)'
  x.beginPath()
  x.arc(cx-br*0.2,cy-br*0.2,br*0.5,0,7)
  x.fill()
 }
 // score
 x.fillStyle='#fff'
 x.textAlign='center'
 x.textBaseline='top'
 x.font='bold '+Math.round(sw*1.2)+'px system-ui'
 x.fillText(String(score),W/2,50)
 x.fillStyle='rgba(255,255,255,0.5)'
 x.font=Math.round(sw*0.5)+'px system-ui'
 x.fillText('Best: '+String(hi),W/2,90)
 // overlays
 if(!running){
  x.fillStyle='#fff'
  x.font='bold '+Math.round(sw*1.3)+'px system-ui'
  x.textBaseline='middle'
  x.fillText('⚡ Tap Rush',W/2,H*0.32)
  x.font=Math.round(sw*0.55)+'px system-ui'
  x.fillStyle='rgba(255,255,255,0.8)'
  x.fillText('Tap anywhere to start',W/2,H*0.42)
  x.font=Math.round(sw*0.4)+'px system-ui'
  x.fillStyle='rgba(255,255,255,0.5)'
  x.fillText('← Tap left  ·  Tap right →',W/2,H*0.50)
  x.fillText('Move the gap away from the balls!',W/2,H*0.56)
 }
 if(!alive&&running){
  x.fillStyle='rgba(0,0,0,0.55)'
  x.fillRect(0,0,W,H)
  x.fillStyle='#e74c3c'
  x.font='bold '+Math.round(sw*1.3)+'px system-ui'
  x.textBaseline='middle'
  x.textAlign='center'
  x.fillText('Game Over',W/2,H*0.32)
  x.fillStyle='#fff'
  x.font='bold '+Math.round(sw*0.9)+'px system-ui'
  x.fillText('Score: '+String(score),W/2,H*0.42)
  x.fillStyle='rgba(255,255,255,0.5)'
  x.font=Math.round(sw*0.5)+'px system-ui'
  x.fillText('Best: '+String(hi),W/2,H*0.50)
  x.fillStyle='rgba(255,255,255,0.8)'
  x.font=Math.round(sw*0.55)+'px system-ui'
  x.fillText('Tap anywhere to retry',W/2,H*0.62)
 }
}

function loop(t){tick(t);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop)
</script>
</body>
</html>
